[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraplog-git2net"
version = "0.1.0"
description = "Transform Git logs into collaboration networks"
authors = [{name = "Jose Teixeira"}]
readme = "README.md"
license = {file = "LICENSE"}
# The code uses Python 3.12 f-string syntax (PEP 701, scraplog/export/log_data.py)
requires-python = ">=3.12"

# Keep in sync with requirements.txt
dependencies = [
    "networkx>=3.0",
    "networkx-temporal>=1.3,<1.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rich>=13.0",
    "loguru>=0.7",
    "xlwt>=1.3",
    "requests>=2.28",
    "requests-cache>=1.0",
    "PyGithub>=2.0",
    "colorama>=0.4",
]

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]
# Only for the lines-of-code network (scraplog/networks/weighted_loc_temporal.py)
loc = ["pydriller>=2.5"]

# Console commands. The top-level *.py files with the same names are thin
# wrappers kept so that ./scrapLog.py etc. keep working without installing.
[project.scripts]
scrapLog = "scraplog.scraplog:main"
transform-nofi-2-nofo = "scraplog.analysis.transform_nofi_to_nofo:main"
report-nofi = "scraplog.analysis.report_nofi:main"
report-nofo = "scraplog.analysis.report_nofo:main"
compare-nofi-sets = "scraplog.analysis.compare_nofi_sets:main"
compare-nofi-metrics = "scraplog.analysis.compare_nofi_metrics:main"
solo-contributors = "scraplog.analysis.solo_contributors:main"
nofi-graphml-network-visualizer = "scraplog.viz.nofi_visualizer:main"
nofo-graphml-network-visualizer = "scraplog.viz.nofo_visualizer:main"
deanonymize-github-users = "scraplog.tools.deanonymize_github_users:main"
scrap-repo-repositories-logs = "scraplog.tools.scrap_repo_logs:main"

[tool.setuptools.packages.find]
include = ["scraplog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
