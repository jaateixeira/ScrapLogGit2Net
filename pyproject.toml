[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraplog-git2net"
version = "0.1.0"
description = "Transform Git logs into collaboration networks"
authors = [{name = "Jose Teixeira"}]
readme = "README.md"
license = {file = "LICENSE"}
# The code uses PEP 604 unions (str | None), so 3.10 is the minimum
requires-python = ">=3.10"

# Keep in sync with requirements.txt
dependencies = [
    "networkx>=3.0",
    "networkx-temporal>=1.3,<1.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rich>=13.0",
    "loguru>=0.7",
    "email-validator>=2.0",
    "xlwt>=1.3",
    "requests>=2.28",
    "requests-cache>=1.0",
    "PyGithub>=2.0",
    "python-dateutil>=2.8",
    "colorama>=0.4",
]

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]
# Only for the lines-of-code network (extract_weighted_LOC_temporal_network.py)
loc = ["pydriller>=2.5"]

# Console commands. Scripts with hyphens in their file names can't be imported,
# so they get commands once they are renamed (reorganization step 3).
[project.scripts]
scrapLog = "scrapLog:main"
transform-nofi-2-nofo = "transform_nofi_2_nofo_graphml:main"
deanonymize-github-users = "deanonymize_github_users:main"
nofi-graphml-network-visualizer = "nofi_graphml_network_visualizer:main"
nofo-graphml-network-visualizer = "nofo_graphml_network_visualizer:main"
scrap-repo-repositories-logs = "scrap_repo_repositories_logs:main"
solo-contributors = "solo_contributors:main"

[tool.setuptools]
packages = ["core", "utils"]
py-modules = [
    "scrapLog",
    "datamodels",
    "deanonymize_github_users",
    "export_graphml_format",
    "export_log_data",
    "extract_temporal_network",
    "extract_unweighted_network",
    "extract_weighted_LOC_temporal_network",
    "extract_weighted_network",
    "networkMeasures",
    "nofi_graphml_network_visualizer",
    "nofo_graphml_network_visualizer",
    "scrap_repo_repositories_logs",
    "solo_contributors",
    "transform_nofi_2_nofo_graphml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
